<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Muffin EMU — Summer Beach special edition</title>
  <defs>
    <!-- Sky: warm at the sun, clear turquoise overhead and out to sea -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFC98F" />
      <stop offset="0.22" stop-color="#FFE6B0" />
      <stop offset="0.48" stop-color="#7FE3F0" />
      <stop offset="1" stop-color="#2CC3E3" />
    </linearGradient>
    <radialGradient id="sunHalo" cx="212" cy="196" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity="0.95" />
      <stop offset="0.28" stop-color="#FFE38A" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FFD27A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunDisc" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#FFFBE3" />
      <stop offset="0.55" stop-color="#FFE45C" />
      <stop offset="1" stop-color="#FFB627" />
    </radialGradient>
    <!-- Sea: bright shallows near the shore, deeper teal at the horizon -->
    <linearGradient id="sea" x1="0" y1="560" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A8FB8" />
      <stop offset="0.45" stop-color="#14B4D6" />
      <stop offset="1" stop-color="#4FDDE6" />
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="760" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7AE" />
      <stop offset="0.5" stop-color="#FCD486" />
      <stop offset="1" stop-color="#F2B95E" />
    </linearGradient>
    <linearGradient id="wetSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B567" stop-opacity="0.85" />
      <stop offset="1" stop-color="#E9B567" stop-opacity="0" />
    </linearGradient>
    <!-- The muffin, as in every icon in the set -->
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDB062" />
      <stop offset="1" stop-color="#B0682C" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#FFE0A8" stop-opacity="0.85" />
      <stop offset="1" stop-color="#FFE0A8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="domeShade" x1="0" y1="470" x2="0" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#643100" stop-opacity="0" />
      <stop offset="1" stop-color="#643100" stop-opacity="0.4" />
    </linearGradient>
    <clipPath id="domeClip"><path d="M300,650 C265,645 225,630 232,600 C238,565 240,530 255,500 C275,460 305,415 340,380 C370,350 400,330 430,320 C455,312 485,300 512,295 C539,300 569,312 594,320 C624,330 654,350 684,380 C719,415 749,460 769,500 C784,530 786,565 792,600 C799,630 759,645 724,650 C660,660 380,660 300,650 Z" /></clipPath>
    <linearGradient id="linerShade" x1="300" y1="0" x2="724" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F6E86" stop-opacity="0.28" />
      <stop offset="0.34" stop-color="#1F6E86" stop-opacity="0" />
      <stop offset="0.6" stop-color="#1F6E86" stop-opacity="0" />
      <stop offset="1" stop-color="#1F6E86" stop-opacity="0.34" />
    </linearGradient>
    <linearGradient id="linerAO" x1="0" y1="660" x2="0" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A6F80" stop-opacity="0.35" />
      <stop offset="1" stop-color="#2A6F80" stop-opacity="0" />
    </linearGradient>
    <clipPath id="linerClip"><polygon points="300,650 724,650 624,895 512,907 400,895" /></clipPath>
    <!-- Sunglasses: sunset-mirror lenses -->
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1F4F" />
      <stop offset="0.55" stop-color="#7A2E7E" />
      <stop offset="1" stop-color="#FF7A6B" />
    </linearGradient>
    <linearGradient id="canopyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B7D" />
      <stop offset="1" stop-color="#E23E5B" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6B4410" flood-opacity="0.25" />
    </filter>
    <filter id="small" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6B4410" flood-opacity="0.25" />
    </filter>
    <filter id="blur18" x="-40%" y="-200%" width="180%" height="500%"><feGaussianBlur stdDeviation="18" /></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3" /></filter>
    <radialGradient id="vig" cx="512" cy="470" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0.62" stop-color="#00586E" stop-opacity="0" />
      <stop offset="1" stop-color="#00586E" stop-opacity="0.16" />
    </radialGradient>
  </defs>

  <!-- Sky, sun and clouds -->
  <rect width="1024" height="1024" fill="url(#sky)" />
  <circle cx="212" cy="196" r="300" fill="url(#sunHalo)" />
  <g stroke="#FFE76A" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="212" y1="62" x2="212" y2="30" />
    <line x1="307" y1="101" x2="330" y2="78" />
    <line x1="346" y1="196" x2="378" y2="196" />
    <line x1="307" y1="291" x2="330" y2="314" />
    <line x1="117" y1="101" x2="94" y2="78" />
    <line x1="78" y1="196" x2="46" y2="196" />
  </g>
  <circle cx="212" cy="196" r="96" fill="url(#sunDisc)" />
  <g fill="#FFFFFF">
    <g opacity="0.95">
      <ellipse cx="770" cy="170" rx="92" ry="34" />
      <circle cx="730" cy="150" r="38" />
      <circle cx="790" cy="134" r="50" />
      <circle cx="842" cy="160" r="34" />
    </g>
    <g opacity="0.7">
      <ellipse cx="890" cy="300" rx="58" ry="20" />
      <circle cx="870" cy="288" r="24" />
      <circle cx="905" cy="280" r="30" />
    </g>
  </g>

  <!-- Sea with rolling waves -->
  <path d="M0,566 C120,552 250,580 380,566 C520,552 650,582 780,566 C880,555 960,570 1024,562 L1024,820 L0,820 Z" fill="url(#sea)" />
  <path d="M0,566 C120,552 250,580 380,566 C520,552 650,582 780,566 C880,555 960,570 1024,562" fill="none" stroke="#B9F6FA" stroke-width="5" opacity="0.8" />
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.55">
    <path d="M60,628 q40,-16 80,0 q40,16 80,0" stroke-width="7" />
    <path d="M780,618 q36,-14 72,0 q36,14 72,0" stroke-width="7" />
    <path d="M150,700 q46,-18 92,0 q46,18 92,0" stroke-width="8" />
    <path d="M700,690 q46,-18 92,0 q46,18 92,0" stroke-width="8" />
  </g>

  <!-- Shore: foam lace, wet sand, then dry sand -->
  <path d="M0,782 C110,752 230,800 360,776 C500,750 620,806 760,778 C870,756 960,786 1024,772 L1024,1024 L0,1024 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M0,798 C120,770 240,814 370,792 C510,768 630,820 770,794 C880,772 965,800 1024,788 L1024,1024 L0,1024 Z" fill="url(#sand)" />
  <path d="M0,798 C120,770 240,814 370,792 C510,768 630,820 770,794 C880,772 965,800 1024,788 L1024,850 L0,850 Z" fill="url(#wetSand)" />
  <g fill="#E0A44E" opacity="0.5">
    <circle cx="120" cy="880" r="4" /><circle cx="168" cy="952" r="3" /><circle cx="262" cy="986" r="4" />
    <circle cx="758" cy="972" r="3" /><circle cx="900" cy="872" r="4" /><circle cx="956" cy="960" r="3" />
    <circle cx="300" cy="860" r="3" /><circle cx="700" cy="868" r="3" />
  </g>

  <!-- Starfish and shell -->
  <g transform="translate(150 924) rotate(-14)" filter="url(#small)">
    <path d="M0,-62 L16,-20 L60,-19 L25,8 L38,52 L0,26 L-38,52 L-25,8 L-60,-19 L-16,-20 Z" fill="#FF8A5B" stroke="#F06A3E" stroke-width="6" stroke-linejoin="round" />
    <g fill="#FFD2B3"><circle cx="0" cy="-30" r="5" /><circle cx="28" cy="-9" r="5" /><circle cx="18" cy="24" r="5" /><circle cx="-18" cy="24" r="5" /><circle cx="-28" cy="-9" r="5" /><circle cx="0" cy="0" r="6" /></g>
  </g>
  <g transform="translate(880 930) rotate(10)" filter="url(#small)">
    <path d="M0,40 C-46,36 -60,-6 -40,-34 C-22,-56 22,-56 40,-34 C60,-6 46,36 0,40 Z" fill="#FFC6D0" stroke="#F497AA" stroke-width="5" />
    <g stroke="#F497AA" stroke-width="4" stroke-linecap="round" fill="none"><path d="M0,36 L0,-46" /><path d="M0,36 L-26,-38" /><path d="M0,36 L26,-38" /><path d="M0,36 L-42,-14" /><path d="M0,36 L42,-14" /></g>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="512" cy="916" rx="268" ry="38" fill="#8A5A16" opacity="0.4" filter="url(#blur18)" />
  <ellipse cx="512" cy="906" rx="232" ry="28" fill="#8A5A16" opacity="0.22" />

  <!-- Liner -->
  <g filter="url(#soft)">
    <polygon points="300,650 353,650 428,900 400,895" fill="#FFFFFF" />
    <polygon points="353,650 406,650 456,904 428,900" fill="#5FD0E8" />
    <polygon points="406,650 459,650 484,906 456,904" fill="#FFFFFF" />
    <polygon points="459,650 512,650 512,907 484,906" fill="#5FD0E8" />
    <polygon points="512,650 565,650 540,906 512,907" fill="#FFFFFF" />
    <polygon points="565,650 618,650 568,904 540,906" fill="#5FD0E8" />
    <polygon points="618,650 671,650 596,900 568,904" fill="#FFFFFF" />
    <polygon points="671,650 724,650 624,895 596,900" fill="#5FD0E8" />
  </g>
  <g clip-path="url(#linerClip)">
    <rect x="300" y="650" width="424" height="260" fill="url(#linerShade)" />
    <rect x="300" y="650" width="424" height="80" fill="url(#linerAO)" />
  </g>

  <!-- Beach-umbrella pick, behind the dome's top -->
  <g transform="translate(642 250) rotate(18)">
    <line x1="0" y1="-8" x2="0" y2="130" stroke="#C9894A" stroke-width="9" stroke-linecap="round" />
    <path d="M-92,0 A92,70 0 0 1 92,0 Z" fill="url(#canopyA)" />
    <path d="M-92,0 A92,70 0 0 1 -55,-56 L-30,0 Z M-30,0 L-14,-69 A92,70 0 0 1 14,-69 L30,0 Z M30,0 L55,-56 A92,70 0 0 1 92,0 Z" fill="#FFF6E8" />
    <path d="M-92,0 Q-76,12 -61,0 Q-46,12 -30,0 Q-15,12 0,0 Q15,12 30,0 Q46,12 61,0 Q76,12 92,0" fill="#E23E5B" stroke="#C72D4A" stroke-width="3" />
    <circle cx="0" cy="-70" r="8" fill="#FFD25A" />
  </g>

  <!-- Dome -->
  <path d="M300,650 C265,645 225,630 232,600 C238,565 240,530 255,500 C275,460 305,415 340,380 C370,350 400,330 430,320 C455,312 485,300 512,295 C539,300 569,312 594,320 C624,330 654,350 684,380 C719,415 749,460 769,500 C784,530 786,565 792,600 C799,630 759,645 724,650 C660,660 380,660 300,650 Z" fill="url(#dome)" />
  <path d="M300,650 C265,645 225,630 232,600 C238,565 240,530 255,500 C275,460 305,415 340,380 C370,350 400,330 430,320 C455,312 485,300 512,295 C539,300 569,312 594,320 C624,330 654,350 684,380 C719,415 749,460 769,500 C784,530 786,565 792,600 C799,630 759,645 724,650 C660,660 380,660 300,650 Z" fill="url(#sheen)" />
  <g clip-path="url(#domeClip)"><rect x="220" y="470" width="590" height="200" fill="url(#domeShade)" /></g>
  <path d="M503,308 Q513,346 507,392" stroke="#7A4A22" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45" />
  <g fill="#453765">
    <circle cx="380" cy="420" r="24" /><circle cx="455" cy="362" r="18" /><circle cx="702" cy="560" r="16" /><circle cx="300" cy="560" r="14" />
  </g>
  <g fill="#FFFFFF" opacity="0.45"><circle cx="372" cy="412" r="7" /><circle cx="449" cy="356" r="5" /></g>

  <!-- Face: sunglasses, blush and a big grin -->
  <g fill="#FF8D8D" opacity="0.55"><ellipse cx="392" cy="566" rx="34" ry="20" /><ellipse cx="632" cy="566" rx="34" ry="20" /></g>
  <g>
    <path d="M374,488 L650,488" stroke="#1E1730" stroke-width="12" stroke-linecap="round" />
    <path d="M384,486 C384,470 402,466 420,466 L476,466 C494,466 504,474 502,492 C499,522 482,544 446,544 C410,544 386,524 384,500 Z" fill="url(#lens)" stroke="#1E1730" stroke-width="10" stroke-linejoin="round" />
    <path d="M640,486 C640,470 622,466 604,466 L548,466 C530,466 520,474 522,492 C525,522 542,544 578,544 C614,544 638,524 640,500 Z" fill="url(#lens)" stroke="#1E1730" stroke-width="10" stroke-linejoin="round" />
    <path d="M502,486 Q512,476 522,486" stroke="#1E1730" stroke-width="10" fill="none" stroke-linecap="round" />
    <g fill="#FFFFFF" opacity="0.85">
      <path d="M408,480 L428,480 L404,522 L396,512 Z" />
      <path d="M564,480 L584,480 L560,522 L552,512 Z" />
    </g>
  </g>
  <path d="M466,580 Q512,624 558,580" stroke="#5C2E10" stroke-width="11" stroke-linecap="round" fill="none" />
  <path d="M478,586 Q512,614 546,586 Q512,600 478,586 Z" fill="#FF7B8A" opacity="0.8" />

  <!-- Sparkle on the sea, and the soft vignette the set shares -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M860,640 l6,16 l16,6 l-16,6 l-6,16 l-6,-16 l-16,-6 l16,-6 Z" />
    <circle cx="96" cy="660" r="5" />
  </g>
  <rect width="1024" height="1024" fill="url(#vig)" />
</svg>
